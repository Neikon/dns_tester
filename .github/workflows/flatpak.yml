# Workflow to build Flatpak bundle on every merge/push to main
# Comments in English as per project conventions
name: Flatpak

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    steps:
      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb

      - name: Add Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 || true

      - name: Import GPG key for Flatpak repo signing
        run: |
          # Import private GPG key for signing OSTree commits (signed repo)
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ secrets.FLATPAK_GPG_KEY_ID }}:6:" | gpg --import-ownertrust
          gpg --list-keys

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch manifest for CI build
        # Replace git source with local dir source so flatpak-builder uses the checked-out code
        run: |
          # Patch manifest to use type dir / path . for CI; keep original manifest untouched in repo
          python3 -c "
          import json, pathlib
          p = pathlib.Path('es.neikon.dns_tester.json')
          data = json.loads(p.read_text())
          for mod in data.get('modules', []):
              if isinstance(mod, dict) and mod.get('name') == 'dns_tester':
                  mod['sources'] = [{'type': 'dir', 'path': '.'}]
          p.write_text(json.dumps(data, indent=4))
          print(p.read_text())
          "

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dns_tester.flatpak
          manifest-path: es.neikon.dns_tester.json
          cache-key: flatpak-builder-${{ github.sha }}
          # Use Flathub to get runtime/sdk
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          # Keep build inside actions cache
          cache: true
          branch: ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }}
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}

      - name: Generate Flatpak repository metadata
        run: |
          # Create flatpakrepo file for the current channel
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CHANNEL="stable"
            TITLE="DNS Tester Stable"
            COMMENT="DNS Tester stable channel (main)"
            GIT_BRANCH="main"
          else
            CHANNEL="beta"
            TITLE="DNS Tester Beta"
            COMMENT="DNS Tester beta channel (develop)"
            GIT_BRANCH="develop"
          fi
          REPO_URL="https://neikon.github.io/dns_tester/${CHANNEL}/"
          echo "Channel: $CHANNEL, URL: $REPO_URL"
          # Generate dns_tester.flatpakrepo inside repo dir (signed with GPGKey)
          GPGKEY=$(echo "${{ secrets.FLATPAK_GPG_PUBLIC_B64 }}" | tr -d '\n')
          cat > repo/dns_tester.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=${TITLE}
          Url=${REPO_URL}
          Homepage=https://github.com/Neikon/dns_tester
          Comment=${COMMENT}
          Icon=https://raw.githubusercontent.com/Neikon/dns_tester/${GIT_BRANCH}/data/icons/hicolor/scalable/apps/es.neikon.dns_tester.svg
          GPGKey=${GPGKEY}
          EOF
          cat repo/dns_tester.flatpakrepo
          # Generate simple index.html for GitHub Pages
          cat > repo/index.html <<EOF
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>${TITLE} Flatpak Repository</title></head>
          <body><h1>${TITLE} Flatpak Repository</h1>
          <p>URL: <code>${REPO_URL}</code></p>
          <p>Add remote (signed repo, use --user if system operation not allowed):</p>
          <pre>flatpak remote-add --if-not-exists dns_tester-${CHANNEL} ${REPO_URL}dns_tester.flatpakrepo
          flatpak install dns_tester-${CHANNEL} es.neikon.dns_tester
          # or per-user on Silverblue/Kinoite:
          flatpak --user remote-add --if-not-exists dns_tester-${CHANNEL} ${REPO_URL}dns_tester.flatpakrepo
          flatpak --user install dns_tester-${CHANNEL} es.neikon.dns_tester</pre>
          <p>Alternative direct bundle:</p>
          <pre>flatpak install --bundle ${REPO_URL}dns_tester.flatpak
          flatpak --user install --bundle ${REPO_URL}dns_tester.flatpak</pre>
          <p><a href="dns_tester.flatpakrepo">dns_tester.flatpakrepo</a> | <a href="dns_tester.flatpak">dns_tester.flatpak (single bundle)</a></p>
          </body></html>
          EOF
          # Copy bundle into repo for direct download
          cp dns_tester.flatpak repo/ || true
          ls -lh repo/

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns_tester-flatpak
          path: dns_tester.flatpak
          if-no-files-found: error

      - name: Extract app version
        id: version
        run: |
          # Extract version from meson.build (project version field)
          VERSION=$(python3 -c "import re; print(re.search(r\"version:\s*'([^']+)'\", open('meson.build').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Publish pre-release on develop
        if: github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: dns_tester.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Flatpak repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: repo
          destination_dir: ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }}
          keep_files: true
          commit_message: "deploy flatpak repo ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }} ${{ steps.version.outputs.version || github.sha }}"

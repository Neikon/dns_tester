# Workflow to build Flatpak bundle on every merge/push to main
# Comments in English as per project conventions
name: Flatpak

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    steps:
      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb

      - name: Add Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 || true

      - name: Import GPG key for Flatpak repo signing
        run: |
          # Import private GPG key for signing OSTree commits (signed repo)
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ secrets.FLATPAK_GPG_KEY_ID }}:6:" | gpg --import-ownertrust
          gpg --list-keys

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch manifest for CI build
        # Replace git source with local dir source so flatpak-builder uses the checked-out code
        run: |
          # Patch manifest to use type dir / path . for CI; keep original manifest untouched in repo
          python3 -c "
          import json, pathlib
          p = pathlib.Path('es.neikon.dns_tester.json')
          data = json.loads(p.read_text())
          for mod in data.get('modules', []):
              if isinstance(mod, dict) and mod.get('name') == 'dns_tester':
                  mod['sources'] = [{'type': 'dir', 'path': '.'}]
          p.write_text(json.dumps(data, indent=4))
          print(p.read_text())
          "

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dns_tester.flatpak
          manifest-path: es.neikon.dns_tester.json
          cache-key: flatpak-builder-${{ github.sha }}
          # Use Flathub to get runtime/sdk
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          # Keep build inside actions cache
          cache: true
          branch: ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }}
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}

      - name: Generate Flatpak repository metadata
        run: |
          # Create flatpakrepo file for the current channel
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CHANNEL="stable"
            TITLE="DNS Tester Stable"
            COMMENT="DNS Tester stable channel (main)"
            GIT_BRANCH="main"
          else
            CHANNEL="beta"
            TITLE="DNS Tester Beta"
            COMMENT="DNS Tester beta channel (develop)"
            GIT_BRANCH="develop"
          fi
          REPO_URL="https://neikon.github.io/dns_tester/${CHANNEL}/"
          echo "Channel: $CHANNEL, URL: $REPO_URL"
          # Generate dns_tester.flatpakrepo inside repo dir (signed with GPGKey)
          GPGKEY=$(echo "${{ secrets.FLATPAK_GPG_PUBLIC_B64 }}" | tr -d '\n')
          cat > repo/dns_tester.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=${TITLE}
          Url=${REPO_URL}
          Homepage=https://github.com/Neikon/dns_tester
          Comment=${COMMENT}
          Icon=https://raw.githubusercontent.com/Neikon/dns_tester/${GIT_BRANCH}/data/icons/hicolor/scalable/apps/es.neikon.dns_tester.svg
          GPGKey=${GPGKEY}
          EOF
          cat repo/dns_tester.flatpakrepo
          # Generate simple index.html for GitHub Pages
          cat > repo/index.html <<EOF
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>${TITLE} Flatpak Repository</title></head>
          <body><h1>${TITLE} Flatpak Repository</h1>
          <p>URL: <code>${REPO_URL}</code></p>
          <p>Add remote (signed repo, use --user if system operation not allowed):</p>
          <pre>flatpak remote-add --if-not-exists dns_tester-${CHANNEL} ${REPO_URL}dns_tester.flatpakrepo
          flatpak install dns_tester-${CHANNEL} es.neikon.dns_tester
          # or per-user on Silverblue/Kinoite:
          flatpak --user remote-add --if-not-exists dns_tester-${CHANNEL} ${REPO_URL}dns_tester.flatpakrepo
          flatpak --user install dns_tester-${CHANNEL} es.neikon.dns_tester</pre>
          <p>Alternative direct bundle:</p>
          <pre>flatpak install --bundle ${REPO_URL}dns_tester.flatpak
          flatpak --user install --bundle ${REPO_URL}dns_tester.flatpak</pre>
          <p><a href="dns_tester.flatpakrepo">dns_tester.flatpakrepo</a> | <a href="dns_tester.flatpak">dns_tester.flatpak (single bundle)</a></p>
          </body></html>
          EOF
          # Copy bundle into repo for direct download
          cp dns_tester.flatpak repo/ || true
          ls -lh repo/

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns_tester-flatpak
          path: dns_tester.flatpak
          if-no-files-found: error

      - name: Extract app version
        id: version
        run: |
          # Extract version from meson.build (project version field)
          VERSION=$(python3 -c "import re; print(re.search(r\"version:\s*'([^']+)'\", open('meson.build').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Publish pre-release on develop
        if: github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: dns_tester.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Flatpak repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: repo
          destination_dir: ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }}
          keep_files: true
          commit_message: "deploy flatpak repo ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }} ${{ steps.version.outputs.version || github.sha }}"

      - name: Generate landing page for gh-pages root
        run: |
          mkdir -p landing
          cat > landing/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>DNS Tester — Flatpak Repositories</title>
          <meta name="description" content="Repositorios Flatpak oficiales de DNS Tester: beta (develop) y stable (main).">
          <link rel="icon" href="https://raw.githubusercontent.com/Neikon/dns_tester/main/data/icons/hicolor/scalable/apps/es.neikon.dns_tester.svg">
          <style>
            :root { --bg:#0f1419; --card:#1a2332; --accent:#3584e4; --text:#eeeeec; --muted:#9a9996; --border:#2e3436; }
            *{box-sizing:border-box} body{margin:0;font-family:Cantarell,Ubuntu,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
            header{background:linear-gradient(135deg,#1c71d8 0%,#3584e4 50%,#62a0ea 100%);padding:3rem 1.5rem 2.5rem;text-align:center}
            header h1{margin:0;font-size:2.4rem;font-weight:800} header p{margin:.6rem auto 0;max-width:640px;opacity:.95}
            header .logo{width:84px;height:84px;background:#fff;border-radius:20px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);margin-bottom:1rem}
            .wrap{max-width:1000px;margin:0 auto;padding:2rem 1.25rem 3rem}
            .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.25rem;margin-top:-1.2rem}
            .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.2)}
            .card h2{margin:0 0 .25rem;font-size:1.35rem;display:flex;align-items:center;gap:.6rem}
            .badge{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.2rem .55rem;border-radius:999px;border:1px solid}
            .beta .badge{color:#62a0ea;border-color:#62a0ea;background:rgba(98,160,234,.12)}
            .stable .badge{color:#33d17a;border-color:#33d17a;background:rgba(51,209,122,.12)}
            .card p{color:var(--muted);margin:.4rem 0 .9rem;font-size:.95rem}
            .repo-url{font-family:ui-monospace,monospace;font-size:.85rem;background:#0f1419;border:1px solid var(--border);border-radius:8px;padding:.6rem .75rem;word-break:break-all;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
            .repo-url code{color:#d8e8ff} .copy{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:.42rem .55rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;flex-shrink:0}
            .copy:hover{filter:brightness(1.1)} .copy svg{pointer-events:none}
            .steps{margin-top:.9rem} .steps h3{font-size:.9rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 .5rem}
            pre{background:#0f1419;border:1px solid var(--border);border-radius:10px;padding:.9rem;overflow:auto;font-size:.82rem;line-height:1.5;margin:0}
            pre code{color:#cce0ff} .note{background:rgba(98,160,234,.12);border:1px solid rgba(98,160,234,.3);border-radius:10px;padding:.8rem 1rem;font-size:.88rem;margin-top:1rem;color:#d0e4ff}
            footer{text-align:center;color:var(--muted);font-size:.85rem;padding:2rem 1rem;border-top:1px solid var(--border);margin-top:2rem}
            footer a{color:var(--accent);text-decoration:none} footer a:hover{text-decoration:underline}
            .hero-actions{margin-top:1.2rem;display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
            .btn{display:inline-flex;align-items:center;gap:.4rem;background:#fff;color:#1c71d8;font-weight:700;padding:.6rem 1.1rem;border-radius:999px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
            .btn.secondary{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:none}
            .grid-links{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
            .grid-links a{font-size:.8rem;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:.3rem .6rem;border-radius:999px}
            .grid-links a:hover{color:var(--text);border-color:var(--accent)}
          </style>
          </head>
          <body>
          <header>
            <img class="logo" src="https://raw.githubusercontent.com/Neikon/dns_tester/main/data/icons/hicolor/scalable/apps/es.neikon.dns_tester.svg" alt="DNS Tester logo">
            <h1>DNS Tester</h1>
            <p>Repositorios Flatpak oficiales — instala la versión <strong>beta</strong> (develop) para probar lo último o <strong>stable</strong> (main) para producción. Repos firmados con GPG.</p>
            <div class="hero-actions"><a class="btn" href="https://github.com/Neikon/dns_tester">★ GitHub</a><a class="btn secondary" href="https://github.com/Neikon/dns_tester/releases">Releases</a></div>
          </header>
          <div class="wrap">
            <div class="cards">
              <section class="card beta"><h2>🧪 Beta <span class="badge">develop</span></h2><p>Canal de pruebas. Se actualiza en cada push a <code>develop</code>.</p><div class="repo-url"><code>https://neikon.github.io/dns_tester/beta/</code> <button class="copy" aria-label="Copiar" onclick="copy(this,'https://neikon.github.io/dns_tester/beta/dns_tester.flatpakrepo')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="10" height="10" rx="2"></rect><path d="M15 9V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"></path></svg></button></div><div class="steps"><h3>Instalación (recomendado --user)</h3><pre><code>flatpak --user remote-add --if-not-exists dns_tester-beta \
            https://neikon.github.io/dns_tester/beta/dns_tester.flatpakrepo
          flatpak --user install dns_tester-beta es.neikon.dns_tester</code></pre></div><div class="grid-links"><a href="beta/dns_tester.flatpakrepo">📄 flatpakrepo</a><a href="beta/dns_tester.flatpak">📦 flatpak</a><a href="beta/">📁 repo</a></div></section>
              <section class="card stable"><h2>✅ Stable <span class="badge">main</span></h2><p>Canal estable. Se actualiza al mergear a <code>main</code>.</p><div class="repo-url"><code>https://neikon.github.io/dns_tester/stable/</code> <button class="copy" aria-label="Copiar" onclick="copy(this,'https://neikon.github.io/dns_tester/stable/dns_tester.flatpakrepo')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="10" height="10" rx="2"></rect><path d="M15 9V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"></path></svg></button></div><div class="steps"><h3>Instalación</h3><pre><code>flatpak --user remote-add --if-not-exists dns_tester-stable \
            https://neikon.github.io/dns_tester/stable/dns_tester.flatpakrepo
          flatpak --user install dns_tester-stable es.neikon.dns_tester</code></pre></div><div class="grid-links"><a href="stable/dns_tester.flatpakrepo">📄 flatpakrepo</a><a href="stable/dns_tester.flatpak">📦 flatpak</a><a href="stable/">📁 repo</a></div></section>
            </div>
            <div class="note"><strong>¿Error ConfigureRemote not allowed?</strong> Usa <code>--user</code> (Silverblue/Kinoite). Los repos están firmados — no necesitas <code>--no-gpg-verify</code>.</div>
            <footer><p>DNS Tester • <a href="https://github.com/Neikon/dns_tester">Neikon/dns_tester</a> • <code>gh-pages</code> (beta/stable) • <a href="https://neikon.github.io/dns_tester/beta/">beta</a> · <a href="https://neikon.github.io/dns_tester/stable/">stable</a></p><p>Guía: <a href="https://github.com/Neikon/dns_tester/blob/develop/docs/flatpak-repos.md">docs/flatpak-repos.md</a></p></footer>
          </div>
          <script>function copy(btn,t){navigator.clipboard.writeText(t).then(()=>{const v=btn.innerHTML;btn.innerHTML='✓';setTimeout(()=>btn.innerHTML=v,1500)});}</script>
          </body>
          </html>
          HTML
          ls -lh landing/

      - name: Deploy landing page to GitHub Pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: landing
          destination_dir: .
          keep_files: true
          commit_message: "deploy landing page ${{ steps.version.outputs.version || github.sha }}"
